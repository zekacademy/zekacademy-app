name: Test ve yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  kurallar:
    name: Güvenlik kuralları testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run test:rules
      - name: Sunucu fonksiyonları yükleniyor mu
        run: |
          npm --prefix functions install --no-audit --no-fund
          node --input-type=module -e "import('./functions/index.js').then(m => console.log('Fonksiyonlar:', Object.keys(m).join(', ')))"

  yayin:
    name: Yayın
    needs: kurallar
    runs-on: ubuntu-latest
    env:
      PROJE: zekacademy-59b2f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Firebase kimliği
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT sırrı bulunamadı"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "::notice::Hizmet hesabı: $(jq -r .client_email "$RUNNER_TEMP/sa.json")"
      - run: npm install -g firebase-tools@13 --no-audit --no-fund
      - name: Deneme adresi (pull request)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! firebase hosting:channel:deploy "pr-${{ github.event.number }}" --expires 14d --project "$PROJE" --json > out.json 2> err.txt; then
            tail -n 25 err.txt out.json firebase-debug.log 2>/dev/null | grep -v '^\s*$' | tail -n 40 | sed 's/^/::error::/'; exit 1; fi
          url=$(jq -r '.result | to_entries[0].value.url' out.json)
          echo "::notice::Deneme adresi: $url"
          gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" -f body="Deneme adresi hazır: $url (14 gün geçerli)" > /dev/null || true
      - name: Canlı yayın (main)
        if: github.event_name != 'pull_request'
        run: |
          if ! firebase deploy --only hosting --project "$PROJE" --non-interactive > out.txt 2>&1; then
            tail -n 40 out.txt | sed 's/^/::error::/'; exit 1; fi
          echo "::notice::Canlı adres: https://app.zekacademy.com"
      - name: Güvenlik kuralları (main)
        if: github.event_name != 'pull_request'
        run: |
          if ! firebase deploy --only firestore:rules --project "$PROJE" --non-interactive > out.txt 2>&1; then
            tail -n 40 out.txt | sed 's/^/::error::/'; exit 1; fi
          echo "::notice::Güvenlik kuralları yayınlandı"
      - name: Sunucu fonksiyonları (main)
        if: github.event_name != 'pull_request'
        run: |
          npm --prefix functions install --no-audit --no-fund
          if ! firebase deploy --only functions --project "$PROJE" --non-interactive --force > out.txt 2>&1; then
            sed 's/\x1b\[[0-9;]*m//g' out.txt > temiz.txt
            { grep -iE "error|denied|permission|failed|hata" temiz.txt | tail -n 25; echo "----- son satırlar -----"; tail -n 25 temiz.txt; } > ozet.txt
            echo "::error title=Fonksiyon yayını::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' ozet.txt)"
            exit 1; fi
          echo "::notice::Sunucu fonksiyonları yayınlandı"
      - name: Temizlik
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
