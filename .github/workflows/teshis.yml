name: Teşhis (bildirim)
on:
  push:
    branches: [teshis]
permissions:
  contents: read
jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kimlik
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npm --prefix functions install --no-audit --no-fund
      - name: Firestore
        run: cp tools/teshis.mjs functions/teshis.mjs && node functions/teshis.mjs
      - name: Cloud Logging (son 4 gün)
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" >/dev/null 2>&1
          for svc in formbasvuru yenikayitbildirimi; do
            echo "===== $svc ====="
            gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$svc AND timestamp>=\"2026-10-30T00:00:00Z\"" --project zekacademy-59b2f --limit 200 --order asc \
              --format='value(timestamp,severity,httpRequest.status,httpRequest.requestMethod,textPayload,jsonPayload.message)' 2>&1 | grep -v "STARTUP TCP probe\|Starting new instance" | cut -c1-260 | tail -n 120
          done
