name: Teşhis (bildirim)
on:
  push:
    branches: [teshis]
permissions:
  contents: read
jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kimlik
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - run: npm --prefix functions install --no-audit --no-fund
      - name: Firestore
        run: cp tools/teshis.mjs functions/teshis.mjs && node functions/teshis.mjs
      - run: npm install -g firebase-tools@13 --no-audit --no-fund
      - name: Fonksiyon kayıtları
        run: |
          for f in formBasvuru yeniKayitBildirimi; do echo "===== $f ====="; firebase functions:log --only $f --project zekacademy-59b2f -n 80 2>&1 | tail -n 80 || true; done
          echo "===== fonksiyon listesi ====="; firebase functions:list --project zekacademy-59b2f 2>&1 | tail -n 30 || true
